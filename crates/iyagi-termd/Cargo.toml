[package]
name = "iyagi-termd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "User-privileged execution daemon: local IPC server, gated launch orchestration, lifecycle."

[lib]
name = "iyagi_termd_lib"
path = "src/lib.rs"

[[bin]]
name = "iyagi-termd"
path = "src/main.rs"

[dependencies]
term-contracts = { workspace = true }
term-core = { workspace = true }
term-platform = { workspace = true }
term-pty = { workspace = true }
term-storage = { workspace = true }
term-secrets = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
tempfile = "3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json"] }
keyring = "4.2.0"
zeroize = { version = "1.8", features = ["serde"] }
httpdate = "1.0.3"

[dev-dependencies]
rusqlite = { workspace = true }
jsonschema = { version = "0.33", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
